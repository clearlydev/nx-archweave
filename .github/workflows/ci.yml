name: CI

on:
  # Docs-only changes start no runner at all (every minute is billed on a private
  # repository). README.md is NOT in the list: a unit test reads it, and the package
  # READMEs ship in the tarballs. A change that touches anything else runs in full.
  # If branch protection ever requires these checks, a skipped workflow leaves them
  # pending — then move the filter into a job that reports success instead.
  push:
    branches: [main]
    paths-ignore:
      - 'internal/**'
      - 'docs/**'
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'internal/**'
      - 'docs/**'
      - 'CHANGELOG.md'
  # The full matrix (every package manager, Windows, Node 24) is where the repository decides
  # it. In the public repository (clearlydev/nx-archweave) Actions minutes are free, so every
  # pull request runs it and a nightly run watches upstream (Nx templates, the registry). In a
  # private copy every minute is billed (Windows twice; a nightly full matrix alone was about
  # 3,000 minutes a month), so pull requests run one leg, the schedule is skipped, and the full
  # matrix runs on demand — Actions → CI → Run workflow, before a release or after an Nx bump.
  workflow_dispatch:
    inputs:
      legs:
        description: 'E2E legs to run: all, or only the Windows ones (cheaper reruns)'
        type: choice
        options: [all, windows]
        default: all
      ubuntu:
        description: 'Ubuntu runner image (try the next one before ubuntu-latest moves to it)'
        type: choice
        options: [ubuntu-latest, ubuntu-26.04, ubuntu-24.04]
        default: ubuntu-latest
  schedule:
    - cron: '0 18 * * *'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The schedule exists for the public repository; a private copy never runs it.
    if: github.event_name != 'schedule' || github.repository == 'clearlydev/nx-archweave'
    runs-on: ${{ inputs.ubuntu || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # engines floor (22); a full run adds the current LTS line above it.
        node-version: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.repository == 'clearlydev/nx-archweave') && '[22, 24]' || '[22]') }}
    steps:
      - uses: actions/checkout@v7

      # Reads the pinned pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build,test,lint,typecheck,bundle

      # Release smoke: pack the plugin, install the tarball into a clean temp
      # project, assert generators.json loads and every factory imports.
      - run: node tools/verify-tarball.mjs

  # The unit tests on Windows, so a test (or a file comparison) that assumes POSIX paths,
  # permissions or LF-only text is caught. Nightly and on a manual run only: pull requests
  # don't wait on a Windows runner. The CRLF handling itself is covered by unit tests that
  # write CRLF text directly; the checkout here is LF (.gitattributes).
  verify-windows:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'clearlydev/nx-archweave')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t test

  # Full create-flow release gate: pack → create a real workspace from the
  # real template → assert wiring, registration, build/lint, doctor gate.
  # On PRs this runs only when code changed. Every failure fails the check, and its
  # first line says whether it is upstream (create-nx-workspace, Nx generators, the
  # workspace install) or ours. The nightly run is the canary for upstream changes.
  e2e:
    # main pushes run verify only: the same tree already passed its pull request.
    if: github.event_name != 'push' && (github.event_name != 'schedule' || github.repository == 'clearlydev/nx-archweave')
    runs-on: ${{ matrix.os || inputs.ubuntu || 'ubuntu-latest' }}
    timeout-minutes: 30
    # The steps are bash; Windows runners ship it with Git.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      # A full run (manual, nightly, or any pull request in the public repository) covers every
      # manager, next with and without a backend, and Windows; a private copy's pull requests run
      # one leg (pnpm × react-vite, the full fullstack flow):
      #   yarn classic runs next (react-vite installs there too; the other managers cover it);
      #   yarn berry runs both frontends (each creates the workspace differently: empty preset + @nx/react vs next preset);
      #   Windows: every manager is a .cmd shim there (the CLI's spawnableCommand path) — npm, pnpm,
      #   yarn berry and bun. Pull requests run all four with react-vite; npm × next on Windows runs
      #   nightly and in the manual full run only, because it alone took 16–17 minutes (installing and
      #   building Next.js on Windows) while every other leg finishes within 7, and the matrix's legs
      #   run at once, so the slowest one is how long a pull request waits. Next.js stays on pull
      #   requests through the Linux legs (yarn berry, yarn classic, next × nest);
      #   next × nest: the Nest leg every full run has; it also passes --preset=solo, the alias of quick-start;
      #   nightly and the manual full run only: npm × react-vite × nest and the backend-only express
      #   and nest workspaces (no web app: Nx's own presets; pnpm prints its dependency check before
      #   `pnpm nx` in the nest one), so pull requests keep today's legs.
      # The manual full run (legs=all) includes every nightly leg: a leg added to the nightly list goes there too.
      matrix:
        include: ${{ fromJSON(inputs.legs == 'windows' && '[{"pm":"npm","frontend":"next","os":"windows-latest"},{"pm":"pnpm","frontend":"react-vite","os":"windows-latest"},{"pm":"yarn","frontend":"react-vite","yarn":"berry","os":"windows-latest"},{"pm":"bun","frontend":"react-vite","os":"windows-latest"}]' || (github.event_name == 'schedule' && '[{"pm":"pnpm","frontend":"react-vite","review":true},{"pm":"npm","frontend":"react-vite"},{"pm":"yarn","frontend":"react-vite","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"classic"},{"pm":"bun","frontend":"react-vite"},{"pm":"npm","frontend":"next","os":"windows-latest"},{"pm":"pnpm","frontend":"react-vite","os":"windows-latest"},{"pm":"yarn","frontend":"react-vite","yarn":"berry","os":"windows-latest"},{"pm":"bun","frontend":"react-vite","os":"windows-latest"},{"pm":"pnpm","frontend":"next","backend":"nest","preset":"solo"},{"pm":"npm","frontend":"react-vite","backend":"nest"},{"pm":"pnpm","frontend":"none","backend":"express"},{"pm":"pnpm","frontend":"none","backend":"nest"}]') || (github.event_name == 'pull_request' && github.repository == 'clearlydev/nx-archweave' && '[{"pm":"pnpm","frontend":"react-vite","review":true},{"pm":"npm","frontend":"react-vite"},{"pm":"yarn","frontend":"react-vite","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"classic"},{"pm":"bun","frontend":"react-vite"},{"pm":"npm","frontend":"react-vite","os":"windows-latest"},{"pm":"pnpm","frontend":"react-vite","os":"windows-latest"},{"pm":"yarn","frontend":"react-vite","yarn":"berry","os":"windows-latest"},{"pm":"bun","frontend":"react-vite","os":"windows-latest"},{"pm":"pnpm","frontend":"next","backend":"nest","preset":"solo"}]') || ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.repository == 'clearlydev/nx-archweave') && '[{"pm":"pnpm","frontend":"react-vite","review":true},{"pm":"npm","frontend":"react-vite"},{"pm":"yarn","frontend":"react-vite","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"berry"},{"pm":"yarn","frontend":"next","yarn":"classic"},{"pm":"bun","frontend":"react-vite"},{"pm":"npm","frontend":"next","os":"windows-latest"},{"pm":"pnpm","frontend":"react-vite","os":"windows-latest"},{"pm":"yarn","frontend":"react-vite","yarn":"berry","os":"windows-latest"},{"pm":"bun","frontend":"react-vite","os":"windows-latest"},{"pm":"pnpm","frontend":"next","backend":"nest","preset":"solo"},{"pm":"npm","frontend":"react-vite","backend":"nest"},{"pm":"pnpm","frontend":"none","backend":"express"},{"pm":"pnpm","frontend":"none","backend":"nest"}]' || '[{"pm":"pnpm","frontend":"react-vite","review":true}]')) }}
    # Check names stay "e2e (pnpm)" / "e2e (npm)" for the existing legs (branch protection may require them).
    name: e2e (${{ matrix.pm }}${{ matrix.yarn && format(' {0}', matrix.yarn) || '' }}${{ matrix.os && ' windows' || '' }}${{ matrix.backend && format(' {0} {1}', matrix.frontend, matrix.backend) || (matrix.frontend != 'react-vite' && format(' {0}', matrix.frontend)) || '' }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this PR touches code
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -qE '^(packages/|tools/e2e-create\.mjs|tools/bundle\.mjs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change — e2e skipped"
          fi

      - uses: pnpm/action-setup@v6
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      # npm 10 (bundled with Node 22) crashes inside create-nx-workspace's own
      # install on the current Nx dependencies (arborist "edgesOut" bug, every
      # 10.x up to 10.9.9); the CLI documents npm >= 11 for the npm path.
      - run: npm install -g npm@11
        if: matrix.pm == 'npm' && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')

      # yarn berry: Corepack (bundled with Node) provides it; pin the global default so a
      # bare `yarn` outside any project is berry, as create-nx-workspace calls it. Run from
      # the temp dir: this repo's package.json pins pnpm, and Corepack refuses yarn here.
      - run: corepack enable yarn && cd "$RUNNER_TEMP" && corepack install -g yarn@4 && yarn --version | grep -q '^4\.'
        if: matrix.yarn == 'berry' && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

      # yarn classic: the runner image ships yarn 1.x globally — make sure it is what runs
      # (from the temp dir, like the e2e script, outside this pnpm-pinned repo).
      - run: cd "$RUNNER_TEMP" && yarn --version | grep -q '^1\.'
        if: matrix.yarn == 'classic' && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')

      # bun: pinned to the version every bun measurement was taken with.
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun' && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')
        with:
          bun-version: 1.4.2

      # The repo itself is pnpm either way — prepack bundles via nx.
      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      # Windows: the e2e workspace and the npm cache go to the runner's work drive (D:, where
      # RUNNER_TEMP is) instead of the user profile on C:. The npm leg spent 13–14 of its 15
      # minutes creating the workspace (the step timings now show which part of it); the job
      # summary of the next runs shows whether the move helps.
      - name: Put temp files and the npm cache on the work drive
        if: runner.os == 'Windows' && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')
        run: |
          {
            echo "TEMP=$RUNNER_TEMP"
            echo "TMP=$RUNNER_TEMP"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
          } >> "$GITHUB_ENV"

      - run: node tools/e2e-create.mjs --pm=${{ matrix.pm }} --frontend=${{ matrix.frontend }} ${{ matrix.backend && format('--backend={0}', matrix.backend) || '' }} ${{ matrix.review && '--review' || '' }} ${{ matrix.preset && format('--preset={0}', matrix.preset) || '' }}
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

  # Experiment: create-nx-workspace on Windows when the workspace is on another drive than
  # the directory `nx new` runs from. Each case runs on its own runner, so package manager
  # setups don't leak into each other. Results are in each job's summary.
  xdrive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    name: xdrive (${{ matrix.id }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: P01, tool: cnw, version: 24.1.0, pm: yarn, yarn: berry, drive: D }
          - { id: P02, tool: cnw, version: 24.0.6, pm: yarn, yarn: berry, drive: C }
          - { id: P03, tool: cnw, version: 24.0.1, pm: yarn, yarn: berry, drive: D }
          - { id: P04, tool: archweave, version: 0.5.0, pm: yarn, yarn: berry, drive: D }
          - { id: P05, tool: archweave, version: 0.5.0, pm: yarn, yarn: berry, drive: C }
          - { id: P06, tool: cnw, version: 24.0.6, pm: npm, drive: D }
          - { id: P07, tool: cnw, version: 24.0.6, pm: pnpm, drive: D }
          - { id: P08, tool: cnw, version: 24.0.6, pm: bun, drive: D }
          - { id: P09, tool: cnw, version: 24.1.0, pm: yarn, yarn: classic, drive: D }
          - { id: P10, tool: cnw, version: 24.0.6, pm: yarn, yarn: berry, drive: D, fix: true }
          - { id: P11, tool: cnw, version: next, pm: yarn, yarn: berry, drive: D }
          - { id: P12, tool: cnw, version: canary, pm: yarn, yarn: berry, drive: D }
    env:
      NX_VERBOSE_LOGGING: 'true'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # yarn berry turns immutable installs on under CI; create-nx-archweave sets this too.
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      GIT_AUTHOR_NAME: probe
      GIT_AUTHOR_EMAIL: probe@example.com
      GIT_COMMITTER_NAME: probe
      GIT_COMMITTER_EMAIL: probe@example.com
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: yarn berry
        if: matrix.yarn == 'berry'
        run: corepack enable yarn && cd "$RUNNER_TEMP" && corepack install -g yarn@4 && yarn --version
      - name: yarn classic
        if: matrix.yarn == 'classic'
        run: cd "$RUNNER_TEMP" && yarn --version
      - name: npm 11
        if: matrix.pm == 'npm'
        run: npm install -g npm@11 && npm --version
      - name: pnpm
        if: matrix.pm == 'pnpm'
        run: npm install -g pnpm@11.9.0 && pnpm --version
      - uses: oven-sh/setup-bun@v2
        if: matrix.pm == 'bun'
        with:
          bun-version: 1.4.2
      - name: Write the preload (cwd trace, optional fix)
        run: |
          cat > "$RUNNER_TEMP/xdrive-preload.cjs" <<'JS'
          // Records the cwd every child process gets. With NX_FIX_NEW_CWD=1 it also rewrites
          // @nx/workspace's new generator to join the preInstall cwd with path.join.
          const cp = require('child_process');
          const fs = require('fs');
          const Module = require('module');
          const log = (entry) => { try { fs.appendFileSync(process.env.XDRIVE_LOG, JSON.stringify({ pid: process.pid, ...entry }) + '\n'); } catch {} };
          for (const name of ['execSync', 'execFileSync', 'spawnSync', 'exec', 'execFile', 'spawn']) {
            const original = cp[name];
            cp[name] = function (command, ...rest) {
              const options = rest.find((a) => a && typeof a === 'object' && !Array.isArray(a)) || {};
              const cwd = options.cwd === undefined ? null : String(options.cwd);
              log({ fn: name, command: String(command).slice(0, 120), cwd, driveless: cwd !== null && /^[\\/](?![\\/])/.test(cwd), cwdExists: cwd === null ? null : fs.existsSync(cwd), processCwd: process.cwd() });
              return original.call(this, command, ...rest);
            };
          }
          const target = /[\\/]@nx[\\/]workspace[\\/]dist[\\/]src[\\/]generators[\\/]new[\\/]new\.js$/;
          const before = 'cwd: (0, devkit_1.joinPathFragments)(tree.root, options.directory),';
          const after = "cwd: require('path').join(tree.root, options.directory),";
          const compile = Module.prototype._compile;
          Module.prototype._compile = function (content, filename) {
            if (process.env.NX_FIX_NEW_CWD === '1' && target.test(filename)) {
              const found = content.includes(before);
              if (found) content = content.replace(before, after);
              log({ fix: found ? 'applied' : 'pattern not found', file: filename });
            }
            return compile.call(this, content, filename);
          };
          JS
      - name: Run ${{ matrix.id }}
        env:
          TOOL: ${{ matrix.tool }}
          VERSION: ${{ matrix.version }}
          PM: ${{ matrix.pm }}
          DRIVE: ${{ matrix.drive }}
          FIX: ${{ matrix.fix && '1' || '0' }}
        run: |
          # The step shell stops at the first failing command; the probe records failures instead.
          set +e +o pipefail
          if [ "$DRIVE" = C ]; then parent="$USERPROFILE/xdrive"; else parent="$RUNNER_TEMP/xdrive"; fi
          parent="$(cygpath -u "$parent")"; mkdir -p "$parent" && cd "$parent"
          resolved="$VERSION"
          [ "$TOOL" = cnw ] && resolved="$(npm view "create-nx-workspace@$VERSION" version)"
          echo "case=${{ matrix.id }} tool=$TOOL version=$resolved pm=$PM ${{ matrix.yarn }} drive=$DRIVE fix=$FIX"
          echo "cwd=$(cygpath -w "$(pwd)") tmpdir=$(node -p "require('os').tmpdir()") homedir=$(node -p "require('os').homedir()")"
          export XDRIVE_LOG="$(cygpath -m "$RUNNER_TEMP/xdrive-trace.jsonl")"
          export NODE_OPTIONS="--require $(cygpath -m "$RUNNER_TEMP/xdrive-preload.cjs")"
          export NX_FIX_NEW_CWD="$FIX"
          if [ "$TOOL" = cnw ]; then
            npx -y "create-nx-workspace@$resolved" demo --preset=empty --pm="$PM" --nxCloud=skip --skipGitHubPush --interactive=false --aiAgents=claude > out.log 2>&1
          else
            npx -y "create-nx-archweave@$resolved" demo --preset=quick-start --frontend=react-vite --backend=none --locale=en --package-manager="$PM" --no-review > out.log 2>&1
          fi
          code=$?
          unset NODE_OPTIONS
          tail -40 out.log
          echo "--- ENOENT lines ---"; grep -n "ENOENT" out.log | head -5 || true
          echo "--- preInstall / drive-less cwd (trace) ---"
          grep -E '"driveless":true|set version|"fix":' "$RUNNER_TEMP/xdrive-trace.jsonl" | tail -10 || true
          echo "RESULT ${{ matrix.id }}: exit $code"
          {
            echo "| case | tool | version | pm | drive | fix | exit |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            echo "| ${{ matrix.id }} | $TOOL | $resolved | $PM ${{ matrix.yarn }} | $DRIVE | $FIX | $code |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  # A workspace nx-archweave did not create: Nx's own Expo preset makes it, the packed plugin is
  # added, and init detects the framework. It covers what the create flow cannot reach (the CLI
  # does not offer Expo). One leg (pnpm, Linux): the package manager matrix is e2e's job. Runs
  # where the full e2e matrix runs; a private copy's pull requests skip it, and a Windows-only
  # manual rerun leaves it out.
  e2e-existing:
    if: github.event_name != 'push' && inputs.legs != 'windows' && (github.event_name == 'workflow_dispatch' || github.repository == 'clearlydev/nx-archweave')
    runs-on: ${{ inputs.ubuntu || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        frontend: [expo]
    name: e2e-existing (${{ matrix.frontend }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this PR touches code
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -qE '^(packages/|tools/e2e-existing\.mjs|tools/bundle\.mjs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change — e2e-existing skipped"
          fi

      - uses: pnpm/action-setup@v6
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - run: node tools/e2e-existing.mjs --frontend=${{ matrix.frontend }}
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

  # The path a user takes with no flags: `npx create-nx-archweave@<version>` resolves the CLI by
  # name, and the CLI installs @clearlydev/nx-archweave@^<its version> by name. e2e passes
  # --plugin-source=<tarball> and never reaches either. A throwaway registry started with
  # `pnpm dlx` (not a devDependency, so it never enters pnpm-lock.yaml) serves both packages;
  # everything else is proxied from npmjs.
  e2e-registry:
    if: github.event_name != 'push' && inputs.legs != 'windows' && (github.event_name == 'workflow_dispatch' || github.repository == 'clearlydev/nx-archweave')
    runs-on: ${{ inputs.ubuntu || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      VERDACCIO_VERSION: 6.11.1
      REGISTRY: http://127.0.0.1:4873/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether this PR touches code
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD | grep -qE '^(packages/|tools/bundle\.mjs|tools/pack-sanitize\.mjs|\.github/workflows/ci\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "docs-only change — e2e-registry skipped"
          fi

      - uses: pnpm/action-setup@v6
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      # npm 10 crashes inside create-nx-workspace's install (see the e2e job).
      - run: npm install -g npm@11
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - run: pnpm install --frozen-lockfile
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'

      - name: Start a throwaway registry
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/registry"
          mkdir -p "$dir/storage"
          # Our two packages are local-only (no uplink), so the registry can never answer with
          # the npmjs copy; everything else comes from npmjs.
          cat > "$dir/config.yml" <<EOF
          storage: $dir/storage
          uplinks:
            npmjs:
              url: https://registry.npmjs.org/
          packages:
            '@clearlydev/*': { access: \$all, publish: \$all }
            'create-nx-archweave': { access: \$all, publish: \$all }
            '**': { access: \$all, proxy: npmjs }
          log: { type: file, path: $dir/verdaccio.log, level: warn }
          EOF
          # From the temp dir: the repo's pnpm settings (overrides, allowBuilds) don't apply to dlx.
          # All of its output goes to a file, so nothing holds this step's output open, and it
          # runs in its own process group (set -m): stopping the group also stops the verdaccio
          # process pnpm starts, which renames itself.
          cd "$RUNNER_TEMP"
          set -m
          nohup pnpm dlx "verdaccio@$VERDACCIO_VERSION" --config "$dir/config.yml" --listen 127.0.0.1:4873 > "$dir/stdout.log" 2>&1 < /dev/null &
          echo $! > "$dir/pid"
          set +m
          for _ in $(seq 1 60); do
            curl -sf "${REGISTRY}-/ping" >/dev/null && { echo "registry up"; exit 0; }
            sleep 2
          done
          echo "::error title=registry::verdaccio@$VERDACCIO_VERSION did not answer /-/ping within 120 s"
          tail -50 "$dir/stdout.log" || true
          exit 1

      - name: Publish both packages to it
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        run: |
          set -euo pipefail
          version="0.0.0-registry.$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          printf '//127.0.0.1:4873/:_authToken=throwaway\n' > "$RUNNER_TEMP/registry/npmrc"
          for dir in packages/nx-plugin packages/create-nx-archweave; do
            (cd "$dir" && npm pkg set version="$version" \
              && npm pack --pack-destination "$RUNNER_TEMP/registry" >/dev/null) \
              || { echo "::error title=pack::npm pack failed in $dir"; exit 1; }
          done
          for tgz in "$RUNNER_TEMP"/registry/clearlydev-nx-archweave-*.tgz "$RUNNER_TEMP"/registry/create-nx-archweave-*.tgz; do
            npm publish "$tgz" --registry "$REGISTRY" --tag ci --userconfig "$RUNNER_TEMP/registry/npmrc" \
              || { echo "::error title=publish::publishing $(basename "$tgz") to the throwaway registry failed"; exit 1; }
          done
          got=$(npm view "@clearlydev/nx-archweave@^$version" version --registry "$REGISTRY")
          [ "$got" = "$version" ] || { echo "::error title=resolve::^$version resolved to '$got'"; exit 1; }

      - name: Create a workspace the way a user does, by name, with no --plugin-source
        if: github.event_name != 'pull_request' || steps.filter.outputs.run == 'true'
        working-directory: ${{ runner.temp }}
        env:
          npm_config_registry: ${{ env.REGISTRY }}
          npm_config_userconfig: ${{ runner.temp }}/registry/npmrc
          CREATE_NX_ARCHWEAVE_TIMINGS: '1'
        run: |
          set -euo pipefail
          npx --yes "create-nx-archweave@$VERSION" demo --preset=solo --frontend=react-vite --backend=none --locale=en --package-manager=npm \
            || { echo "::error title=create::create-nx-archweave@$VERSION failed (see the log above)"; exit 1; }
          spec=$(node -p "require('./demo/package.json').devDependencies['@clearlydev/nx-archweave']")
          installed=$(node -p "require('./demo/node_modules/@clearlydev/nx-archweave/package.json').version")
          echo "plugin spec: $spec, installed: $installed"
          [ "$spec" = "^$VERSION" ] || { echo "::error title=plugin-spec::the CLI wrote '$spec', expected '^$VERSION'"; exit 1; }
          [ "$installed" = "$VERSION" ] || { echo "::error title=plugin-install::installed $installed, expected $VERSION"; exit 1; }

      - name: Stop the registry
        if: always() && (github.event_name != 'pull_request' || steps.filter.outputs.run == 'true')
        run: |
          kill -- "-$(cat "$RUNNER_TEMP/registry/pid" 2>/dev/null)" 2>/dev/null || true
          if [ "${{ job.status }}" != "success" ]; then tail -50 "$RUNNER_TEMP/registry/verdaccio.log" 2>/dev/null || true; fi

  # Publish rehearsal without credentials: prepack (bundle + pack-sanitize)
  # must survive `npm publish --dry-run` for both publishable packages.
  publish-dry-run:
    if: github.event_name != 'push' && (github.event_name != 'schedule' || github.repository == 'clearlydev/nx-archweave')
    runs-on: ${{ inputs.ubuntu || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: |
          set -euo pipefail
          for dir in packages/nx-plugin packages/create-nx-archweave; do
            log="/tmp/publish-dry-run-$(basename "$dir").log"
            echo "::group::npm publish --dry-run ($dir)"
            # npm 11, as a real publish would use: it rewrites a manifest it finds wrong (a
            # "./dist/bin.js" bin path was dropped from the registry manifest) — fail on that.
            # npm refuses even a dry run over a version that's already on npm, so this runs
            # under a throwaway prerelease version that's never published.
            (cd "$dir" && npm pkg set version="0.0.0-ci.$GITHUB_RUN_ID" \
              && npx -y npm@11 publish --dry-run --tag ci 2>&1 | tee "$log")
            grep -E "npm notice (name|package):" "$log"
            if grep -qE "auto-corrected|was invalid and removed" "$log"; then
              echo "::error::npm rewrote the $dir manifest at publish — run 'npm pkg fix' there and commit it"
              exit 1
            fi
            echo "::endgroup::"
          done
          # the plugin tarball must carry its generator manifest, the CLI its bin
          grep -q "generators.json" /tmp/publish-dry-run-nx-plugin.log
          grep -q "dist/bin.js" /tmp/publish-dry-run-create-nx-archweave.log
