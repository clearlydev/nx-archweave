name: PR title

# Pull requests are squash-merged, so the title becomes the commit on main that `nx release` reads
# for the version bump and the changelog. It must be a Conventional Commit: `<type>(<scope>): <summary>`.
# pull_request_target only reads the title — nothing from the pull request is checked out or run.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            ci
            build
            chore
            revert
          requireScope: false
