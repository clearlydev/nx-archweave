# The actions nx-archweave's generated review workflows use, pinned exactly as
# packages/template-engine/src/review/action-pins.ts pins them. Nothing runs here: the file
# exists so Dependabot (which reads only workflow files) opens pull requests when a pinned
# action releases. A spec fails until action-pins.ts matches this file again.
name: Pinned actions

on: workflow_dispatch

permissions: {}

jobs:
  pins:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
      - uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
      - uses: openai/codex-action@306c6a196a99dcc6582530c396a19d2672d5e9ec # v1.14
